version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: prahari_db
    environment:
      POSTGRES_DB: prahari
      POSTGRES_USER: prahari
      POSTGRES_PASSWORD: prahari
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U prahari" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: prahari_backend
    environment:
      DATABASE_URL: postgresql://prahari:prahari@db:5432/prahari
      SECRET_KEY: prahari-demo-secret-key-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OLLAMA_URL: http://host.docker.internal:11434 # Connect to Ollama on your Windows host
      OLLAMA_MODEL: qwen3:8b # Change to the exact tag from `ollama list`
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app # Mount backend code for development
      - ./ml:/app/ml
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: prahari_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000/ws
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
