version: '3.8'

services:
  chat-backend:
    build: ./backend
    container_name: prahari_chat_backend
    ports:
      - "8001:8001"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chat-frontend:
    build: ./frontend
    container_name: prahari_chat_frontend
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: /api
      BACKEND_URL: http://chat-backend:8001
    depends_on:
      - chat-backend
